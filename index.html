<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17639B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bitabo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column. Summary strip, then a filterable list; editor and paper preview replace the list. */
:root{
  --bg:#F3F8FD; --surface:#FFFFFF; --ink:#0F1E2B; --muted:#57697A; --line:#D9E6F2;
  --accent:#17639B; --accent-ink:#FFFFFF; --accent-soft:#E3EFF9; --accent-fg:#17639B;
  --warn:#9A5206; --warn-soft:#FBEBD3; --bad:#B0261D; --bad-soft:#FADCD9; --good:#17713F; --good-soft:#D9F0E2;
  --paper:#FFFFFF; --paper-ink:#141A18; --paper-muted:#5E6A66; --paper-line:#D9DFDC;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree","Helvetica Neue",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
:root[data-theme="dark"]{
  --bg:#0C131B; --surface:#131C26; --ink:#E6EEF6; --muted:#93A6B8; --line:#25323F;
  --accent:#7CC4F2; --accent-ink:#08233A; --accent-soft:#12293A; --accent-fg:#8FD0FA;
  --warn:#F0B35F; --warn-soft:#3A2A10; --bad:#FF8C82; --bad-soft:#3F1B18; --good:#6FD9A0; --good-soft:#133524; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px}
*{box-sizing:border-box}
.wrap{max-width:980px;margin:0 auto;padding-block:18px 64px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:22px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:var(--r);font-weight:500;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn.ghost{background:transparent}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.sum>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sum small{display:block;color:var(--muted);font-size:12.5px}
.sum b{font-family:var(--f-num);font-weight:500;font-size:19px;font-variant-numeric:tabular-nums}
.sum .over b{color:var(--bad)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 12px;min-height:40px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:110px 1fr auto auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-inline:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--accent-soft)}
.num{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.cl{min-width:0}
.cl b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl span{color:var(--muted);font-size:13px}
.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-fg);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.mute{background:var(--line);color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:20px;margin-bottom:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;min-height:40px;width:100%;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
h3{font-size:16px;margin-bottom:10px}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:1fr 1fr 70px 120px 110px 36px;gap:8px;align-items:center}
.line .amt{font-size:14px}
.lh{display:grid;grid-template-columns:1fr 1fr 70px 120px 110px 36px;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px}
.tot{margin-left:auto;width:min(340px,100%);display:flex;flex-direction:column;gap:6px;margin-top:14px}
.tot div{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px}
.tot .big{font-size:17px;font-weight:500;border-top:1px solid var(--line);padding-top:8px}
.stack{display:flex;flex-direction:column;gap:16px}
.back{margin-bottom:12px}
.paperbox{overflow-x:auto;padding-bottom:6px}
.paper{background:var(--paper);color:var(--pi);width:100%;max-width:794px;margin:0 auto;padding:34px 40px 0;border-radius:4px;border:1px solid var(--paper-line);min-width:620px;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
.paper .phd{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:16px;border-bottom:3px solid var(--pb)}
.paper .plg img{max-height:74px;max-width:230px;display:block}
.paper .pname{font-size:26px;font-weight:800}
.paper .pbiz{text-align:right;display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:#5c6166}
.paper .pbiz b{font-size:17px;color:var(--pi);margin-bottom:3px}
.paper .ptr{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.paper h2{font-family:inherit;font-size:34px;font-weight:800;letter-spacing:.01em;text-transform:uppercase}
.paper .pstamp{border:2px solid #2e7d1b;color:#2e7d1b;font-weight:800;letter-spacing:.1em;padding:3px 12px;border-radius:5px;font-size:14px}
.paper .pcols{display:flex;justify-content:space-between;gap:24px;margin-top:18px}
.paper .plab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#5c6166;font-weight:700}
.paper .pcname{font-size:19px;font-weight:700;margin-top:5px}
.paper .pcsub{font-size:13px;color:#5c6166;margin-top:3px;line-height:1.5}
.paper .pmeta{min-width:230px;font-size:13px}
.paper .pmeta div{display:flex;justify-content:space-between;gap:16px;padding:2px 0}
.paper .pmeta span{color:#5c6166}
.paper table{width:100%;border-collapse:collapse;margin-top:26px}
.paper th{background:var(--pb);color:var(--pbi);font-size:11.5px;font-weight:700;text-align:left;padding:10px 10px;letter-spacing:.07em;text-transform:uppercase}
.paper td{padding:12px 10px;font-size:13.5px;vertical-align:top;text-align:left;border-bottom:1px solid #d9dde0}
.paper td:nth-child(3){color:#5c6166}
.paper th.n,.paper td.n{width:36px}
.paper th.r,.paper td.r{text-align:right;white-space:nowrap}
.paper .pmid{display:flex;justify-content:space-between;gap:24px;margin-top:22px;align-items:flex-start}
.paper .pthanks{font-weight:700;font-size:14px;padding-top:6px}
.paper .ptots{width:min(340px,100%);display:flex;flex-direction:column;gap:7px}
.paper .ptots div{display:flex;justify-content:space-between;gap:16px;font-size:13.5px}
.paper .ptots .tt-bar{background:var(--pb);color:var(--pbi);font-weight:700;font-size:15px;padding:11px 12px}
.paper .ptots .tt-green{color:#2e7d1b;font-weight:700}
.paper .ptots .tt-orange{color:#e17d14;font-weight:700}
.paper .pbot{display:flex;justify-content:space-between;gap:30px;margin-top:30px;align-items:flex-end}
.paper .pbl{flex:1;min-width:0}
.paper .pbl h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#5c6166;margin:18px 0 6px}
.paper .pbl h4:first-child{margin-top:0}
.paper .pbl p{margin:0 0 3px;font-size:13.5px;font-weight:700}
.paper .pbl p span{font-weight:400;color:#5c6166;display:inline-block;min-width:118px}
.paper .pbl p.pt{font-weight:400;white-space:pre-wrap;line-height:1.55}
.paper .pbl p.sm{font-size:12px;color:#5c6166}
.paper .psig{width:210px;text-align:center;flex:none}
.paper .psig img{max-height:70px;max-width:190px;display:block;margin:0 auto 4px}
.paper .psig .gap{height:54px}
.paper .psig .sl{border-top:1.5px solid var(--pi);margin-bottom:6px}
.paper .psig b{font-size:13px}
.paper .pband{background:var(--pb);color:var(--pbi);text-align:center;font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:15px;padding:16px 10px;margin:34px -40px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:500;z-index:9}
.hint{color:var(--muted);font-size:13px}
@media (max-width:640px){
  .item{grid-template-columns:1fr auto;grid-template-areas:"cl amt" "num pill"}
  .item .num{grid-area:num}.item .cl{grid-area:cl}.item .amt{grid-area:amt}.item .pill{grid-area:pill;justify-self:end}
  .lh{display:none}
  .line{grid-template-columns:70px 1fr 36px;grid-template-areas:"d d x" "n n n" "q p p";padding-bottom:10px;border-bottom:1px solid var(--line)}
  .line .ld{grid-area:d}.line .ln{grid-area:n}.line .lq{grid-area:q}.line .lp{grid-area:p}.line .lx{grid-area:x}.line .la{display:none}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}
.navtabs{margin-bottom:16px;width:fit-content;max-width:100%;overflow-x:auto}
.navtabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rowc{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.rowc:last-child{border-bottom:0}
.rsum{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:6px;max-width:420px}
.rsum div{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px}
.rsum .big{border-top:1px solid var(--line);padding-top:8px;font-weight:500}
.rsum .bal{font-weight:600;font-size:15px}
.rsum .bal.o{color:var(--warn)}.rsum .bal.g{color:var(--good)}
details>summary{cursor:pointer;font-weight:600;font-family:var(--f-display)}
@media (max-width:640px){.rowc{grid-template-columns:1fr;gap:8px}}

.login{max-width:420px;margin:7vh auto 0}
.item.acct{grid-template-columns:90px 1fr auto auto}
.clbtn{border:0;background:transparent;text-align:left;padding:0;cursor:pointer;min-width:0}
.clbtn:hover b{text-decoration:underline}
.cstat b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.brow{display:grid;grid-template-columns:minmax(80px,1fr) 1.2fr auto;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.brow .bk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bt{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.brow .bt i{display:block;height:100%;background:var(--accent);border-radius:99px}
.brow .bv{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
label.inl{flex-direction:row;align-items:center;gap:8px}
label.inl input{width:auto}
@media (max-width:640px){.item.acct{grid-template-columns:1fr auto;grid-template-areas:"cl amt" "num pill"}.item.acct .num{grid-area:num}.item.acct .cl{grid-area:cl}.item.acct .amt{grid-area:amt}.item.acct .pill{grid-area:pill;justify-self:end}}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{color:var(--accent-fg)}
.brand .logo .mark,.logo .mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1}

/* phone layout */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.wrap,.top,.bar,.panel,.list,.sum,.grid2{min-width:0}
.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
@media (max-width:640px){
  body{padding-inline:14px}
  input,select,textarea{font-size:16px;min-height:46px}
  .btn{min-height:46px}
  .btn.small{min-height:38px;padding:6px 12px}
  .top{gap:10px;margin-bottom:12px}
  .top>.row{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .top>.row .btn{width:100%;padding-inline:8px}
  .navtabs{width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
  .navtabs button{padding:9px 4px;text-align:center}
  .sum{grid-template-columns:1fr 1fr;gap:8px}
  .sum>div{padding:10px 12px}
  .sum b{font-size:15px;word-break:break-word}
  .bar{flex-direction:column;align-items:stretch}
  .bar .tabs{width:100%;overflow-x:auto}
  .search{width:100%;min-width:0}
  .item{grid-template-columns:minmax(0,1fr) auto}
  .rowc{grid-template-columns:minmax(0,1fr);gap:8px}
  .rowc .row{justify-content:flex-start}
  h2{font-size:20px}
  .paperbox{overflow:hidden}
  .logo h1{font-size:20px}
}
.panel .rowc{padding-inline:0}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ---------- state & storage ---------- */
const TYPES={quote:{label:"Quote",title:"Quotation",pre:"QT-"},invoice:{label:"Invoice",title:"Invoice",pre:"INV-"},receipt:{label:"Receipt",title:"Receipt",pre:"RC-"}};
const PAY=["Mobile Money (MoMo)","Cash","Bank","Other"];
const CURRENCIES=["UGX","KES","TZS","RWF","USD","EUR","GBP"];
const S={docs:[],clients:[],services:[],settings:{name:"Sonart Images",phone:"",email:"sonartphotos@gmail.com",address:"Uganda",currency:"UGX",payInfo:"",momoNumber:"",momoName:"",bankName:"",bankAcc:"",bankAccName:"",tagline:"",brand:"#111113",terms:"Quote valid for 14 days. A 50% deposit confirms the booking."},view:"list",tab:"all",q:"",cur:null,edit:null,ce:null,se:null,cc:null,rng:{preset:"month",from:"",to:""},user:"",mode:"in",msg:""};
let DB=null;const LS="sonart-billing-v1";
const CFG=(typeof window!=="undefined"&&window.BITABO_CONFIG)||{};
const CLOUD=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase);
let SB=null,UID=null,CH=null,pullT=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const norm=s=>String(s||"").trim().toLowerCase();
const num=v=>+v||0;
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||"null")}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify({docs:S.docs,clients:S.clients,services:S.services,settings:S.settings}))}catch(e){}}
async function put(col,o){
  const a=S[col],i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);
  if(DB){try{await DB.doc(col+"/"+o.id).set(o)}catch(e){toast("Could not save online. Kept on this device.");lsSet()}}else lsSet();
}
async function del(col,id){
  S[col]=S[col].filter(x=>x.id!==id);
  if(DB){try{await DB.doc(col+"/"+id).delete()}catch(e){}}else lsSet();
}
async function saveSettings(){if(DB){try{await DB.doc("app/settings").set(S.settings)}catch(e){toast("Could not save settings online.")}}else lsSet()}

/* ---------- maths ---------- */
const money=n=>{const c=S.settings.currency;const dec=["UGX","TZS","RWF","KES"].includes(c)?0:2;return(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec})+" "+c};
function calc(d){const sub=(d.items||[]).reduce((a,l)=>a+num(l.q)*num(l.p),0);const tax=sub*num(d.taxRate)/100;return{sub,tax,total:sub+tax}}
const recPaid=r=>(r.paid!==undefined&&r.paid!==null&&r.paid!=="")?num(r.paid):calc(r).total;
const recService=r=>r.service||(r.items&&r.items[0]&&r.items[0].d)||"";
const recKey=r=>r.sourceId?"s:"+r.sourceId:"c:"+norm(r.client&&r.client.name)+"|"+norm(recService(r));
const paidOf=inv=>S.docs.filter(r=>r.type==="receipt"&&r.sourceId===inv.id).reduce((a,r)=>a+recPaid(r),0);
function prevFor(r){const k=recKey(r),t=r.createdAt||Infinity;return S.docs.filter(x=>x.type==="receipt"&&x.id!==r.id&&recKey(x)===k&&(x.createdAt||0)<t).reduce((a,x)=>a+recPaid(x),0)}
function recInfo(r){const prev=(r.prev!==undefined&&r.prev!==null)?num(r.prev):prevFor(r),paid=recPaid(r),price=num(r.price);return{prev,paid,price,total:prev+paid,bal:price>0?Math.max(0,price-prev-paid):null}}
function invStatus(d){const t=calc(d).total,p=paidOf(d),bal=t-p;if(t>0&&bal<=0)return["Paid","good"];if(d.due&&d.due<today()&&bal>0)return["Overdue","bad"];if(p>0)return["Part paid","warn"];return["Unpaid","warn"]}
function statusOf(d){
  if(d.type==="receipt"){const i=recInfo(d);if(i.bal===null)return["Received","good"];return i.bal>0?["Balance "+money(i.bal),"warn"]:["Paid in full","good"]}
  if(d.type==="invoice")return invStatus(d);
  const m={draft:["Draft","mute"],sent:["Sent",""],accepted:["Accepted","good"],declined:["Declined","bad"]};return m[d.status||"draft"];
}
function nextNumber(type){const pre=TYPES[type].pre;let max=num((S.settings.counters||{})[type]);S.docs.filter(d=>d.type===type).forEach(d=>{const n=parseInt(String(d.number).replace(/\D/g,""),10);if(n>max)max=n});return pre+String(max+1).padStart(4,"0")}
async function bumpCounter(d){
  const n=parseInt(String(d.number).replace(/\D/g,""),10)||0,c=Object.assign({},S.settings.counters||{});
  if(n>num(c[d.type])){c[d.type]=n;S.settings.counters=c;await saveSettings()}
}
function methodText(d){return d.methodSel==="Other"?(d.methodOther||"Other"):(d.methodSel||d.method||"")}
function blank(type,over){
  const b={id:uid(),type,number:nextNumber(type),date:today(),due:type==="receipt"?"":addDays(today(),14),client:{name:"",phone:"",email:"",address:""},items:[{d:"",n:"",q:1,p:0}],taxRate:0,notes:"",terms:S.settings.terms||"",status:"draft",createdAt:Date.now()};
  if(type==="receipt")Object.assign(b,{service:"",price:"",paid:"",methodSel:PAY[0],methodOther:"",ref:"",sourceId:"",items:[]});
  return Object.assign(b,over||{});
}
const findClient=n=>S.clients.find(c=>norm(c.name)===norm(n));
const findService=n=>S.services.find(c=>norm(c.name)===norm(n));
async function rememberClient(c){
  if(!c.name)return;const f=findClient(c.name);
  if(!f){await put("clients",{id:uid(),name:c.name,phone:c.phone||"",email:c.email||"",address:c.address||""})}
  else{let ch=false;["phone","email","address"].forEach(k=>{if(!f[k]&&c[k]){f[k]=c[k];ch=true}});if(ch)await put("clients",f)}
}
async function rememberService(name,price,desc){
  if(!name||!(num(price)>0)||/^payment for /i.test(name)||findService(name))return;
  await put("services",{id:uid(),name:name.trim(),price:num(price),desc:desc||""});
}

  a.innerHTML=v==="login"?loginHTML():v==="client"?clientDetailHTML():v==="totals"?reportHTML():v==="edit"?(S.edit.type==="receipt"?receiptEditorHTML():editorHTML()):v==="view"?viewHTML():v==="settings"?settingsHTML():v==="clients"?clientsHTML():v==="services"?servicesHTML():listHTML();
  if(v==="edit"&&S.edit.type==="receipt")updateRecSummary();
  if(v==="view")fitPaper();
}

  const inv=S.docs.filter(d=>d.type==="invoice");
  let owed=0,over=0;inv.forEach(d=>{const b=calc(d).total-paidOf(d);if(b>0){owed+=b;if(d.due&&d.due<today())over+=b}});
  const m=today().slice(0,7);
  const rec=S.docs.filter(d=>d.type==="receipt"&&(d.date||"").startsWith(m)).reduce((a,d)=>a+recPaid(d),0);
  const open=S.docs.filter(d=>d.type==="quote"&&["draft","sent"].includes(d.status||"draft")).length;
  let rows=S.docs.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(S.tab!=="all")rows=rows.filter(d=>d.type===S.tab);
  const q=norm(S.q);
  if(q)rows=rows.filter(d=>norm(d.number+" "+d.client.name+" "+d.client.phone+" "+recService(d)).includes(q));
  const tabs=[["all","All"],["quote","Quotes"],["invoice","Invoices"],["receipt","Receipts"]].map(([k,l])=>`<button data-a="tab" data-t="${k}" aria-pressed="${S.tab===k}">${l}</button>`).join("");
  const body=rows.length?rows.map(d=>{const [st,cl]=statusOf(d);const amt=d.type==="receipt"?recPaid(d):calc(d).total;
    return `<button class="item" data-a="open" data-id="${d.id}">
    <span class="num">${esc(d.number)}<br>${esc(TYPES[d.type].label)}</span>
    <span class="cl"><b>${esc(d.client.name||"No client name")}</b><span>${d.type==="receipt"&&recService(d)?esc(recService(d))+" · ":""}${esc(d.date)}${d.type==="invoice"&&d.due?" · due "+esc(d.due):""}</span></span>
    <span class="amt">${money(amt)}</span><span class="pill ${cl}">${esc(st)}</span></button>`}).join("")
   :`<div class="empty"><h2>${S.docs.length?"Nothing matches":"No documents yet"}</h2><p>${S.docs.length?"Try another filter or search.":"Type a client and what they paid for to make a receipt in seconds. Or start with a quote and turn it into an invoice when they accept."}</p>
     ${S.docs.length?"":`<div class="row" style="justify-content:center"><button class="btn primary" data-a="new" data-t="receipt">Make a receipt</button><button class="btn" data-a="new" data-t="quote">Create a quote</button><button class="btn" data-a="examples">Add example data</button></div>`}</div>`;
  return topHTML()+`<div class="sum"><div class="${over>0?"over":""}"><small>Owed to you</small><b>${money(owed)}</b></div><div><small>Overdue</small><b>${money(over)}</b></div><div><small>Received this month</small><b>${money(rec)}</b></div><div><small>Quotes waiting</small><b>${open}</b></div></div>
  <div class="bar"><div class="tabs">${tabs}</div><input class="search" id="q" type="search" placeholder="Search by number, client, phone or service" value="${esc(S.q)}"></div>

}
function totalsHTML(d,extra){
  const c=calc(d);
  return `<div class="tot"><div><span>Subtotal</span><span>${money(c.sub)}</span></div>
  ${num(d.taxRate)?`<div><span>Tax ${num(d.taxRate)}%</span><span>${money(c.tax)}</span></div>`:""}
  <div class="big"><span>Total</span><span>${money(c.total)}</span></div>${extra||""}</div>`;
}
/* One template for every document. docParts() decides WHAT is shown; paperHTML() and makePDF() only draw it. */
function hexRGB(h){const m=/^#?([0-9a-f]{6})$/i.exec(h||"");const n=parseInt(m?m[1]:"111113",16);return[n>>16&255,n>>8&255,n&255]}
function brandColors(){
  const b=hexRGB(S.settings.brand),ink=b.map(v=>Math.round(v*0.18)),lum=(0.2126*b[0]+0.7152*b[1]+0.0722*b[2])/255;
  return{b,ink,on:lum>0.55?ink:[255,255,255]};
}
const rgbCss=c=>"rgb("+c.join(",")+")";
function payLines(st){
  const L=[];
  if(st.momoNumber)L.push(["Mobile Money",[st.momoNumber,st.momoName].filter(Boolean).join("  ·  ")]);
  if(st.bankName)L.push(["Bank",st.bankName]);
  if(st.bankAcc)L.push(["Account number",st.bankAcc]);
  if(st.bankAccName)L.push(["Account name",st.bankAccName]);
  return L;
}
function docParts(d){
  const s=S.settings,c=calc(d),T=TYPES[d.type];
  const src=d.sourceId?S.docs.find(x=>x.id===d.sourceId):null;
  const P={title:T.title,toLabel:d.type==="receipt"?"Received from":d.type==="quote"?"Prepared for":"Billed to",
    client:d.client,rows:[],totals:[],meta:[],pay:{head:"Payment details",lines:[],text:""},notes:d.notes||"",terms:"",stamp:"",thanks:"Thank you for your business"};
  P.meta.push([T.label+" no.",d.number],["Date",d.date]);
  if(d.due&&d.type!=="receipt")P.meta.push([d.type==="quote"?"Valid until":"Due date",d.due]);
  if(src)P.meta.push(["For",src.number]);
  if(d.type==="receipt"){
    const i=recInfo(d),shown=i.price>0?i.price:i.paid;
    P.rows=[{d:recService(d),n:"",q:1,p:shown}];
    if(i.price>0)P.totals.push({k:"Full price",v:money(i.price),t:"plain"});
    if(i.prev>0)P.totals.push({k:"Already paid",v:money(i.prev),t:"plain"});
    P.totals.push({k:"Amount paid today",v:money(i.paid),t:"bar"},{k:"Total amount paid",v:money(i.total),t:"green"});
    if(i.bal!==null)P.totals.push({k:"Balance due",v:money(i.bal),t:"orange"});
    if(i.bal===0)P.stamp="PAID IN FULL";
    P.pay={head:"Payment received",lines:[["Paid by",methodText(d)],...(d.ref?[["Reference",d.ref]]:[])],text:""};
  }else{
    P.rows=d.items.filter(l=>l.d||l.n||num(l.p));
    P.totals.push({k:"Subtotal",v:money(c.sub),t:"plain"});
    if(num(d.taxRate))P.totals.push({k:"Tax "+num(d.taxRate)+"%",v:money(c.tax),t:"plain"});
    P.totals.push({k:"Total",v:money(c.total),t:"bar"});
    if(d.type==="invoice"){
      const rec=S.docs.filter(r=>r.type==="receipt"&&r.sourceId===d.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      const p=paidOf(d);
      const D=rec.length?rec.map(r=>r.date).sort().pop():"";
      const amt=rec.filter(r=>r.date===D).reduce((a,r)=>a+recPaid(r),0);
      P.totals.push({k:!D||D===today()?"Amount paid today":"Amount paid ("+D+")",v:money(amt),t:"plain"});
      P.totals.push({k:"Total amount paid",v:money(p),t:"green"},{k:"Balance due",v:money(Math.max(0,c.total-p)),t:"orange"});
      if(c.total>0&&c.total-p<=0)P.stamp="PAID";
    }
    P.pay={head:"Payment details",lines:payLines(s),text:s.payInfo||""};
    P.terms=d.terms||"";
  }
  return P;
}
function paperHTML(d){
  const p=docParts(d),s=S.settings;
  const contact=[s.phone?"Tel: "+esc(s.phone):"",s.address?"Located: "+esc(s.address):"",s.email?"Email: "+esc(s.email):""].filter(Boolean);
  const cs=[p.client.phone,p.client.email,p.client.address].filter(Boolean).map(esc).join("<br>");
  const payBlock=(p.pay.lines.length||p.pay.text)?`<h4>${p.pay.head}</h4>${p.pay.lines.map(l=>`<p><span>${esc(l[0])}</span> ${esc(l[1])}</p>`).join("")}${p.pay.text?`<p class="pt">${esc(p.pay.text)}</p>`:""}`:"";
  const bc=brandColors();
  return `<div class="paper" style="--pb:${rgbCss(bc.b)};--pbi:${rgbCss(bc.on)};--pi:${rgbCss(bc.ink)}">
   <div class="phd"><div class="plg">${s.logo?`<img src="${s.logo}" alt="">`:`<div class="pname">${esc(s.name)}</div>`}</div>
    <div class="pbiz">${s.logo?`<b>${esc(s.name)}</b>`:""}${contact.map(c=>`<span>${c}</span>`).join("")}</div></div>
   <div class="ptr"><h2>${p.title}</h2>${p.stamp?`<span class="pstamp">${p.stamp}</span>`:""}</div>
   <div class="pcols"><div><div class="plab">${p.toLabel}</div><div class="pcname">${esc(p.client.name||"-")}</div>${cs?`<div class="pcsub">${cs}</div>`:""}</div>
    <div class="pmeta">${p.meta.map(m=>`<div><span>${esc(m[0])}</span><b>${esc(m[1])}</b></div>`).join("")}</div></div>
   <table><thead><tr><th class="n">#</th><th>Item</th><th>Description</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Total</th></tr></thead><tbody>
    ${p.rows.map((l,i)=>`<tr><td class="n">${i+1}</td><td>${esc(l.d)}</td><td>${esc(l.n||"")}</td><td class="r">${num(l.q)}</td><td class="r">${money(l.p)}</td><td class="r">${money(num(l.q)*num(l.p))}</td></tr>`).join("")}</tbody></table>
   <div class="pmid"><div class="pthanks">${p.thanks}</div><div class="ptots">${p.totals.map(t=>`<div class="tt-${t.t}"><span>${esc(t.k)}</span><span>${t.v}</span></div>`).join("")}</div></div>
   <div class="pbot"><div class="pbl">${payBlock}${p.notes?`<h4>Notes</h4><p class="pt">${esc(p.notes)}</p>`:""}${p.terms?`<h4>Terms and conditions</h4><p class="pt sm">${esc(p.terms)}</p>`:""}</div>
    <div class="psig">${s.sig?`<img src="${s.sig}" alt="">`:`<div class="gap"></div>`}<div class="sl"></div><b>Authorized sign</b></div></div>
   ${s.tagline?`<div class="pband">${esc(s.tagline)}</div>`:""}</div>`;
}

function updateRecSummary(){
  const el=$("#rsum");if(!el)return;const d=S.edit;
  const draft=Object.assign({},d,{prev:undefined});const i=recInfo(draft);
  const rows=[];
  if(i.price>0)rows.push(["Full price",money(i.price)]);
  rows.push(["Already paid",money(i.prev)],["Paid today",money(i.paid)]);
  el.innerHTML=`<div class="rsum">${rows.map(r=>`<div><span>${r[0]}</span><span>${r[1]}</span></div>`).join("")}
   <div class="big"><span>Total paid so far</span><span>${money(i.total)}</span></div>
   ${i.bal!==null?`<div class="bal ${i.bal>0?"o":"g"}"><span>Balance</span><span>${i.bal>0?money(i.bal):"Paid in full"}</span></div>`:`<div class="hint">Add the full price to see the balance.</div>`}</div>`;
}

async function recomputePrev(key){
  const list=S.docs.filter(x=>x.type==="receipt"&&recKey(x)===key).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  let run=0;
  for(const r of list){if(r.prev===undefined||r.prev===null||num(r.prev)!==run){r.prev=run;await put("docs",r)}run+=recPaid(r)}
}

/* ---------- clients: balances and detail ---------- */
function acctsFor(name){
  const n=norm(name),A=[];
  const invs=S.docs.filter(d=>d.type==="invoice"&&norm(d.client.name)===n);
  invs.forEach(i=>{const price=calc(i).total,paid=paidOf(i);A.push({label:i.number+(i.items[0]&&i.items[0].d?" · "+i.items[0].d:""),kind:"Invoice",price,paid,bal:Math.max(0,price-paid),open:i.id})});
  const g={};
  S.docs.filter(r=>r.type==="receipt"&&norm(r.client.name)===n&&!(r.sourceId&&invs.some(i=>i.id===r.sourceId))).forEach(r=>{(g[recKey(r)]=g[recKey(r)]||[]).push(r)});
  Object.values(g).forEach(list=>{
    list.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));const last=list[list.length-1];
    const paid=list.reduce((a,r)=>a+recPaid(r),0),price=Math.max(0,...list.map(r=>num(r.price)));
    A.push({label:recService(last),kind:"Receipts",price,paid,bal:price>0?Math.max(0,price-paid):null,open:last.id});
  });
  return A;
}
function clientTotals(name){
  const A=acctsFor(name);
  return{A,billed:A.reduce((a,x)=>a+x.price,0),paid:A.reduce((a,x)=>a+x.paid,0),bal:A.reduce((a,x)=>a+(x.bal||0),0),docs:S.docs.filter(d=>norm(d.client.name)===norm(name))};
}

function rangeDates(){
  const r=S.rng,t=new Date(),iso=x=>x.toISOString().slice(0,10),y=t.getFullYear(),m=t.getMonth();
  if(r.preset==="month")return[iso(new Date(Date.UTC(y,m,1))),iso(new Date(Date.UTC(y,m+1,0)))];
  if(r.preset==="30")return[addDays(today(),-29),today()];
  if(r.preset==="year")return[y+"-01-01",y+"-12-31"];

}

/* ---------- output: text and PDF ---------- */
function textOf(d){
  const s=S.settings,L=[];
  L.push(`*${TYPES[d.type].title.toUpperCase()} ${d.number}*`,s.name,"");
  if(d.client.name)L.push(`${d.type==="receipt"?"Received from":"For"}: ${d.client.name}`);
  L.push(`Date: ${d.date}`);
  if(d.type==="receipt"){
    const i=recInfo(d);
    L.push(`For: ${recService(d)}`,"");
    if(i.price>0)L.push(`Full price: ${money(i.price)}`);
    if(i.prev>0)L.push(`Already paid: ${money(i.prev)}`);
    L.push(`*Amount paid today: ${money(i.paid)}*`,`Total amount paid: ${money(i.total)}`);
    if(i.bal!==null)L.push(i.bal>0?`*Balance: ${money(i.bal)}*`:"*Paid in full*");
    L.push(`Paid by: ${methodText(d)}${d.ref?" (Ref "+d.ref+")":""}`);
  }else{
    const c=calc(d);
    if(d.due)L.push(`${d.type==="quote"?"Valid until":"Due"}: ${d.due}`);L.push("");
    d.items.filter(l=>l.d||num(l.p)).forEach(l=>L.push(`${l.d} - ${num(l.q)} x ${money(l.p)} = ${money(num(l.q)*num(l.p))}`));
    L.push("");if(num(d.taxRate))L.push(`Tax ${num(d.taxRate)}%: ${money(c.tax)}`);
    L.push(`*Total: ${money(c.total)}*`);
    if(d.type==="invoice"){const p=paidOf(d);L.push(`Paid: ${money(p)}`,`*Balance due: ${money(c.total-p)}*`)}
    {const pl=payLines(s);if(pl.length||s.payInfo){L.push("","Payment details:");pl.forEach(l=>L.push(l[0]+": "+l[1]));if(s.payInfo)L.push(s.payInfo)}}
  }
  if(d.notes)L.push("",d.notes);
  return L.join("\n");
}
function makePDF(d){

  const s=S.settings,p=docParts(d);

  const fill=c=>doc.setFillColor(c[0],c[1],c[2]),txt=c=>doc.setTextColor(c[0],c[1],c[2]),draw=c=>doc.setDrawColor(c[0],c[1],c[2]);
  const img=(data,x,yy,w,h)=>{try{doc.addImage(data,data.startsWith("data:image/png")?"PNG":"JPEG",x,yy,w,h)}catch(e){}};
  const band=()=>{if(!tag)return;fill(BR);doc.rect(0,H-16,W,16,"F");txt(ON);doc.setFont("helvetica","bold").setFontSize(12);doc.text(s.tagline.toUpperCase(),W/2,H-6,{align:"center"})};
  const newPage=()=>{band();doc.addPage();y=M};
  const need=h=>{if(y+h>BOT){newPage();return true}return false};
  // header: logo (or name) left, business details right
  let hy=y,lh=0;
  if(s.logo&&s.logoW&&s.logoH){let h=22,w=h*s.logoW/s.logoH;if(w>60){w=60;h=w*s.logoH/s.logoW}img(s.logo,M,y,w,h);lh=h}
  else{txt(INK);doc.setFont("helvetica","bold").setFontSize(20).text(s.name||"",M,y+8);lh=12}
  let ry=y+5;txt(INK);
  if(s.logo){doc.setFont("helvetica","bold").setFontSize(14).text(s.name||"",R,ry,{align:"right"});ry+=5.5}
  doc.setFont("helvetica","normal").setFontSize(9).setTextColor(MUT[0],MUT[1],MUT[2]);
  [s.phone&&"Tel: "+s.phone,s.address&&"Located: "+s.address,s.email&&"Email: "+s.email].filter(Boolean).forEach(t=>{doc.text(t,R,ry,{align:"right"});ry+=4.6});
  y=Math.max(y+lh,ry)+6;

  if(p.stamp){doc.setFontSize(12);const w=doc.getTextWidth(p.stamp)+8;draw([46,125,27]);doc.setLineWidth(.7).roundedRect(R-w,y-5,w,10,1.5,1.5);txt([46,125,27]);doc.text(p.stamp,R-w/2,y+1.6,{align:"center"})}
  y+=13;

  y+=6;txt(INK);doc.setFont("helvetica","bold").setFontSize(13).text(p.client.name||"-",M,y);
  doc.setFont("helvetica","normal").setFontSize(9.5);txt(MUT);
  [p.client.phone,p.client.email,p.client.address].filter(Boolean).forEach(t=>{y+=5;doc.text(t,M,y)});
  let my=cy0;p.meta.forEach(m=>{txt(MUT);doc.setFont("helvetica","normal").setFontSize(9.5).text(m[0],R-48,my);txt(INK);doc.setFont("helvetica","bold").text(String(m[1]),R,my,{align:"right"});my+=5.8});
  y=Math.max(y,my)+10;
  // table

async function downloadPDF(d){

/* ---------- logo / signature image ---------- */
function loadLogo(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("read"));
    fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error("img"));
      im.onload=()=>{
        const mw=520,sc=Math.min(1,mw/im.naturalWidth),w=Math.max(1,Math.round(im.naturalWidth*sc)),h=Math.max(1,Math.round(im.naturalHeight*sc));
        const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
        x.drawImage(im,0,0,w,h);let url=c.toDataURL("image/png");
        if(url.length>180000){x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);url=c.toDataURL("image/jpeg",.85)}
        res({logo:url,logoW:w,logoH:h});
      };im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

/* ---------- optional cloud login (Supabase) ---------- */
function adapter(){return{doc(path){let [col,id]=path.split("/");if(path==="app/settings"){col="settings";id="app"}return{
  async set(o){const {error}=await SB.from("records").upsert({user_id:UID,col,id,data:o,updated_at:new Date().toISOString()},{onConflict:"user_id,col,id"});if(error)throw error},
  async delete(){const {error}=await SB.from("records").delete().eq("user_id",UID).eq("col",col).eq("id",id);if(error)throw error}}}}}
const CK=LS+"-cloud";
function applyRows(rows){
  const d={docs:[],clients:[],services:[]};let st=null;
  rows.forEach(r=>{if(r.col==="settings")st=r.data;else if(d[r.col])d[r.col].push(r.data)});
  S.docs=d.docs;S.clients=d.clients;S.services=d.services;if(st)S.settings=Object.assign(S.settings,st);
}
async function pull(){
  const {data,error}=await SB.from("records").select("col,id,data");
  if(error){
    try{const c=JSON.parse(localStorage.getItem(CK+"-"+UID)||"null");if(c){applyRows(c);toast("Offline. Showing your last saved data.")}else toast("Could not load your data.")}catch(e){toast("Could not load your data.")}
    return null;
  }
  try{localStorage.setItem(CK+"-"+UID,JSON.stringify(data))}catch(e){}
  applyRows(data);return data;
}
async function startCloud(session){
  UID=session.user.id;S.user=session.user.email||"";DB=adapter();
  const rows=await pull();
  if(rows&&rows.length===0){ // first sign-in: bring over anything made on this device before
    const l=lsGet();
    if(l&&((l.docs||[]).length||(l.clients||[]).length||(l.services||[]).length)){
      const up=[];
      (l.docs||[]).forEach(o=>up.push({col:"docs",id:o.id,data:o}));
      (l.clients||[]).forEach(o=>up.push({col:"clients",id:o.id,data:o}));
      (l.services||[]).forEach(o=>up.push({col:"services",id:o.id,data:o}));
      if(l.settings)up.push({col:"settings",id:"app",data:l.settings});
      const {error}=await SB.from("records").upsert(up.map(r=>Object.assign({user_id:UID,updated_at:new Date().toISOString()},r)),{onConflict:"user_id,col,id"});
      if(!error){await pull();toast("Your data from this device was added to your account.")}
    }
  }
  S.view="list";S.msg="";render();
  if(CH)SB.removeChannel(CH);
  CH=SB.channel("records-"+UID).on("postgres_changes",{event:"*",schema:"public",table:"records",filter:"user_id=eq."+UID},()=>refresh()).subscribe();
}
function refresh(){
  clearTimeout(pullT);
  pullT=setTimeout(async()=>{
    if(!UID||!["list","view","clients","client","services","totals"].includes(S.view))return;
    if(await pull())render();
  },350);
}
function stopCloud(){
  if(CH){SB.removeChannel(CH);CH=null}
  UID=null;DB=null;S.user="";S.docs=[];S.clients=[];S.services=[];
}

/* ---------- boot ---------- */
(async function boot(){
  if(CLOUD){
    SB=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
    let sess=null;try{sess=(await SB.auth.getSession()).data.session}catch(e){}
    if(sess)await startCloud(sess);else{S.view="login";render()}
    return;
  }
  const l=lsGet();if(l){S.docs=l.docs||[];S.clients=l.clients||[];S.services=l.services||[];S.settings=Object.assign(S.settings,l.settings||{})}
  render();
  try{
    DB=(typeof claude!=="undefined")?await claude.use("db"):null;
    if(DB){
      const live=()=>["list","view","clients","client","services","totals"].includes(S.view);
      DB.doc("app/settings").onSnapshot(s=>{if(s.exists){S.settings=Object.assign(S.settings,s.data());if(S.view==="list")render()}},()=>{});
      DB.collection("docs").onSnapshot(q=>{S.docs=q.docs.map(x=>x.data());if(live())render()},()=>{DB=null});
      DB.collection("clients").onSnapshot(q=>{S.clients=q.docs.map(x=>x.data());if(S.view==="clients")render()},()=>{});
      DB.collection("services").onSnapshot(q=>{S.services=q.docs.map(x=>x.data());if(S.view==="services")render()},()=>{});
    }
  }catch(e){DB=null}
})();

</script>

<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
