<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0C6A5A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bitabo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{margin:0}body{font-size:14px}</style>
<title>Bitabo</title>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one working column. Summary strip, then a filterable list; editor and paper preview replace the list. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#10201B; --muted:#58696A; --line:#DCE3E0;
  --accent:#0C6A5A; --accent-ink:#FFFFFF; --accent-soft:#DDEFE9;
  --warn:#9A5206; --warn-soft:#FBEBD3; --bad:#B0261D; --bad-soft:#FADCD9; --good:#17713F; --good-soft:#D9F0E2;
  --paper:#FFFFFF; --paper-ink:#141A18; --paper-muted:#5E6A66; --paper-line:#D9DFDC;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree","Helvetica Neue",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#141D1A; --ink:#E7EFEC; --muted:#93A59F; --line:#26332F;
  --accent:#3FC4A6; --accent-ink:#04211A; --accent-soft:#16312B;
  --warn:#F0B35F; --warn-soft:#3A2A10; --bad:#FF8C82; --bad-soft:#3F1B18; --good:#6FD9A0; --good-soft:#133524; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#141D1A; --ink:#E7EFEC; --muted:#93A59F; --line:#26332F;
  --accent:#3FC4A6; --accent-ink:#04211A; --accent-soft:#16312B;
  --warn:#F0B35F; --warn-soft:#3A2A10; --bad:#FF8C82; --bad-soft:#3F1B18; --good:#6FD9A0; --good-soft:#133524; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px}
*{box-sizing:border-box}
.wrap{max-width:980px;margin:0 auto;padding-block:18px 64px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:22px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:var(--r);font-weight:500;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn.ghost{background:transparent}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.sum>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.sum small{display:block;color:var(--muted);font-size:12.5px}
.sum b{font-family:var(--f-num);font-weight:500;font-size:19px;font-variant-numeric:tabular-nums}
.sum .over b{color:var(--bad)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 12px;min-height:40px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:110px 1fr auto auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-inline:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--accent-soft)}
.num{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.cl{min-width:0}
.cl b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl span{color:var(--muted);font-size:13px}
.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.mute{background:var(--line);color:var(--muted)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:20px;margin-bottom:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;min-height:40px;width:100%;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
h3{font-size:16px;margin-bottom:10px}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:1fr 1fr 70px 120px 110px 36px;gap:8px;align-items:center}
.line .amt{font-size:14px}
.lh{display:grid;grid-template-columns:1fr 1fr 70px 120px 110px 36px;gap:8px;font-size:12px;color:var(--muted);margin-bottom:4px}
.tot{margin-left:auto;width:min(340px,100%);display:flex;flex-direction:column;gap:6px;margin-top:14px}
.tot div{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px}
.tot .big{font-size:17px;font-weight:500;border-top:1px solid var(--line);padding-top:8px}
.stack{display:flex;flex-direction:column;gap:16px}
.back{margin-bottom:12px}
.paper{background:var(--paper);color:var(--paper-ink);width:100%;max-width:794px;margin:0 auto;padding:40px 44px 48px;border-radius:4px;border:1px solid var(--paper-line);min-width:600px;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif}
.paper .pc{text-align:center}
.paper .plogo{max-height:78px;max-width:260px}
.paper .pname{font-size:26px;font-weight:700}
.paper .paddr{margin-top:14px;font-size:14px;text-transform:uppercase;letter-spacing:.01em}
.paper .pcon{font-size:12.5px;color:#444;margin-top:2px}
.paper .ptop{display:flex;justify-content:space-between;gap:24px;margin-top:20px}
.paper .ptitle{font-size:52px;font-weight:800;line-height:1;text-transform:uppercase;letter-spacing:-.01em}
.paper .pmeta{margin-top:20px;font-size:14.5px;line-height:1.6}
.paper .pr{width:44%}
.paper .pbar{background:#4f4f4f;color:#fff;padding:9px 16px;font-size:15px}
.paper .pcl{padding:14px 16px 0;font-size:20px;font-weight:700;text-align:right}
.paper .pcl small{display:block;font-size:12.5px;font-weight:400;color:#444;margin-top:3px}
.paper table{width:100%;border-collapse:collapse;margin-top:46px}
.paper th{background:#222;color:#fff;font-size:13px;font-weight:700;text-align:left;padding:9px 10px;text-transform:uppercase}
.paper td{padding:12px 10px;font-size:14px;vertical-align:top;text-align:left;border:0;font-family:inherit}
.paper tbody tr:nth-child(even) td{background:#f5f5f5}
.paper th.r,.paper td.r{text-align:right;white-space:nowrap}
.paper .pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:30px;font-weight:700;font-size:14.5px;padding:0 14px 0 0}
.paper .pfoot .psub{display:flex;gap:70px}
.paper .prow{display:flex;justify-content:flex-end;gap:60px;margin-top:8px;padding-right:14px;font-size:14px}
.paper .ptotal{display:flex;justify-content:space-between;background:#222;color:#fff;font-weight:700;font-size:15px;padding:13px 14px 13px 40px;margin:24px 0 0 auto;width:52%}
.paper .pgreen,.paper .porange{display:flex;justify-content:flex-end;gap:60px;font-weight:700;font-size:15px;margin-top:10px;padding-right:14px}
.paper .pgreen{color:#2e7d1b}.paper .porange{color:#f0922b}
.paper .pbot{display:flex;justify-content:space-between;gap:30px;margin-top:34px}
.paper .pbot h4{font-size:20px;margin:0 0 12px;font-weight:700}
.paper .pbot p{margin:0;font-size:14px;line-height:1.7;white-space:pre-wrap}
.paper .pbot .small{font-size:12.5px;line-height:1.55}
.paper .psig{text-align:center;min-width:180px;align-self:flex-end}
.paper .psig img{max-height:80px;max-width:200px;display:block;margin:0 auto 6px}
.paper .psig b{font-size:14.5px}
.paper .pstamp{display:inline-block;border:3px solid #2e7d1b;color:#2e7d1b;font-weight:800;letter-spacing:.12em;padding:2px 14px;border-radius:4px;transform:rotate(-5deg);margin-top:16px;font-size:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:500;z-index:9}
.hint{color:var(--muted);font-size:13px}
@media (max-width:640px){
  .item{grid-template-columns:1fr auto;grid-template-areas:"cl amt" "num pill"}
  .item .num{grid-area:num}.item .cl{grid-area:cl}.item .amt{grid-area:amt}.item .pill{grid-area:pill;justify-self:end}
  .lh{display:none}
  .line{grid-template-columns:70px 1fr 36px;grid-template-areas:"d d x" "n n n" "q p p";padding-bottom:10px;border-bottom:1px solid var(--line)}
  .line .ld{grid-area:d}.line .ln{grid-area:n}.line .lq{grid-area:q}.line .lp{grid-area:p}.line .lx{grid-area:x}.line .la{display:none}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}
.navtabs{margin-bottom:16px;width:fit-content;max-width:100%;overflow-x:auto}
.navtabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rowc{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.rowc:last-child{border-bottom:0}
.rsum{margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--bg);display:flex;flex-direction:column;gap:6px;max-width:420px}
.rsum div{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:14px}
.rsum .big{border-top:1px solid var(--line);padding-top:8px;font-weight:500}
.rsum .bal{font-weight:600;font-size:15px}
.rsum .bal.o{color:var(--warn)}.rsum .bal.g{color:var(--good)}
details>summary{cursor:pointer;font-weight:600;font-family:var(--f-display)}
@media (max-width:640px){.rowc{grid-template-columns:1fr;gap:8px}}

.login{max-width:420px;margin:7vh auto 0}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ---------- state & storage ---------- */
const TYPES={quote:{label:"Quote",title:"Quotation",pre:"QT-"},invoice:{label:"Invoice",title:"Invoice",pre:"INV-"},receipt:{label:"Receipt",title:"Receipt",pre:"RC-"}};
const PAY=["Mobile Money (MoMo)","Cash","Bank","Other"];
const CURRENCIES=["UGX","KES","TZS","RWF","USD","EUR","GBP"];
const S={docs:[],clients:[],services:[],settings:{name:"Sonart Images",phone:"",email:"sonartphotos@gmail.com",address:"Uganda",currency:"UGX",payInfo:"",terms:"Quote valid for 14 days. A 50% deposit confirms the booking."},view:"list",tab:"all",q:"",cur:null,edit:null,ce:null,se:null,user:"",mode:"in",msg:""};
let DB=null;const LS="sonart-billing-v1";
const CFG=(typeof window!=="undefined"&&window.BITABO_CONFIG)||{};
const CLOUD=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase);
let SB=null,UID=null,CH=null,pullT=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const norm=s=>String(s||"").trim().toLowerCase();
const num=v=>+v||0;
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
function lsGet(){try{return JSON.parse(localStorage.getItem(LS)||"null")}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify({docs:S.docs,clients:S.clients,services:S.services,settings:S.settings}))}catch(e){}}
async function put(col,o){
  const a=S[col],i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);
  if(DB){try{await DB.doc(col+"/"+o.id).set(o)}catch(e){toast("Could not save online. Kept on this device.");lsSet()}}else lsSet();
}
async function del(col,id){
  S[col]=S[col].filter(x=>x.id!==id);
  if(DB){try{await DB.doc(col+"/"+id).delete()}catch(e){}}else lsSet();
}
async function saveSettings(){if(DB){try{await DB.doc("app/settings").set(S.settings)}catch(e){toast("Could not save settings online.")}}else lsSet()}

/* ---------- maths ---------- */
const money=n=>{const c=S.settings.currency;const dec=["UGX","TZS","RWF","KES"].includes(c)?0:2;return(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec})+" "+c};
function calc(d){const sub=(d.items||[]).reduce((a,l)=>a+num(l.q)*num(l.p),0);const tax=sub*num(d.taxRate)/100;return{sub,tax,total:sub+tax}}
const recPaid=r=>(r.paid!==undefined&&r.paid!==null&&r.paid!=="")?num(r.paid):calc(r).total;
const recService=r=>r.service||(r.items&&r.items[0]&&r.items[0].d)||"";
const recKey=r=>r.sourceId?"s:"+r.sourceId:"c:"+norm(r.client&&r.client.name)+"|"+norm(recService(r));
const paidOf=inv=>S.docs.filter(r=>r.type==="receipt"&&r.sourceId===inv.id).reduce((a,r)=>a+recPaid(r),0);
function prevFor(r){const k=recKey(r),t=r.createdAt||Infinity;return S.docs.filter(x=>x.type==="receipt"&&x.id!==r.id&&recKey(x)===k&&(x.createdAt||0)<t).reduce((a,x)=>a+recPaid(x),0)}
function recInfo(r){const prev=(r.prev!==undefined&&r.prev!==null)?num(r.prev):prevFor(r),paid=recPaid(r),price=num(r.price);return{prev,paid,price,total:prev+paid,bal:price>0?Math.max(0,price-prev-paid):null}}
function invStatus(d){const t=calc(d).total,p=paidOf(d),bal=t-p;if(t>0&&bal<=0)return["Paid","good"];if(d.due&&d.due<today()&&bal>0)return["Overdue","bad"];if(p>0)return["Part paid","warn"];return["Unpaid","warn"]}
function statusOf(d){
  if(d.type==="receipt"){const i=recInfo(d);if(i.bal===null)return["Received","good"];return i.bal>0?["Balance "+money(i.bal),"warn"]:["Paid in full","good"]}
  if(d.type==="invoice")return invStatus(d);
  const m={draft:["Draft","mute"],sent:["Sent",""],accepted:["Accepted","good"],declined:["Declined","bad"]};return m[d.status||"draft"];
}
function nextNumber(type){const pre=TYPES[type].pre;let max=0;S.docs.filter(d=>d.type===type).forEach(d=>{const n=parseInt(String(d.number).replace(/\D/g,""),10);if(n>max)max=n});return pre+String(max+1).padStart(4,"0")}
function methodText(d){return d.methodSel==="Other"?(d.methodOther||"Other"):(d.methodSel||d.method||"")}
function blank(type,over){
  const b={id:uid(),type,number:nextNumber(type),date:today(),due:type==="receipt"?"":addDays(today(),14),client:{name:"",phone:"",email:"",address:""},items:[{d:"",n:"",q:1,p:0}],taxRate:0,notes:"",terms:S.settings.terms||"",status:"draft",createdAt:Date.now()};
  if(type==="receipt")Object.assign(b,{service:"",price:"",paid:"",methodSel:PAY[0],methodOther:"",ref:"",sourceId:"",items:[]});
  return Object.assign(b,over||{});
}
const findClient=n=>S.clients.find(c=>norm(c.name)===norm(n));
const findService=n=>S.services.find(c=>norm(c.name)===norm(n));
async function rememberClient(c){
  if(!c.name)return;const f=findClient(c.name);
  if(!f){await put("clients",{id:uid(),name:c.name,phone:c.phone||"",email:c.email||"",address:c.address||""})}
  else{let ch=false;["phone","email","address"].forEach(k=>{if(!f[k]&&c[k]){f[k]=c[k];ch=true}});if(ch)await put("clients",f)}
}
async function rememberService(name,price,desc){
  if(!name||!(num(price)>0)||/^payment for /i.test(name)||findService(name))return;
  await put("services",{id:uid(),name:name.trim(),price:num(price),desc:desc||""});
}

/* ---------- render ---------- */
function render(){
  const a=$("#app");
  const v=S.view;
  a.innerHTML=v==="login"?loginHTML():v==="edit"?(S.edit.type==="receipt"?receiptEditorHTML():editorHTML()):v==="view"?viewHTML():v==="settings"?settingsHTML():v==="clients"?clientsHTML():v==="services"?servicesHTML():listHTML();
  if(v==="edit"&&S.edit.type==="receipt")updateRecSummary();
}
function topHTML(){
  const nav=[["list","Documents"],["clients","Clients"],["services","Services"]].map(([k,l])=>`<button data-a="nav" data-t="${k}" aria-pressed="${S.view===k}">${l}</button>`).join("");
  return `<div class="top"><div class="brand"><h1>Bitabo</h1><span>${esc(S.settings.name||"Your business")} · Quotes, invoices and receipts</span></div>
  <div class="row"><button class="btn primary" data-a="new" data-t="receipt">New receipt</button>
  <button class="btn" data-a="new" data-t="invoice">New invoice</button>
  <button class="btn" data-a="new" data-t="quote">New quote</button>
  <button class="btn" data-a="settings">Business details</button></div></div>
  <div class="tabs navtabs">${nav}</div>`;
}
function listHTML(){
  const inv=S.docs.filter(d=>d.type==="invoice");
  let owed=0,over=0;inv.forEach(d=>{const b=calc(d).total-paidOf(d);if(b>0){owed+=b;if(d.due&&d.due<today())over+=b}});
  const m=today().slice(0,7);
  const rec=S.docs.filter(d=>d.type==="receipt"&&(d.date||"").startsWith(m)).reduce((a,d)=>a+recPaid(d),0);
  const open=S.docs.filter(d=>d.type==="quote"&&["draft","sent"].includes(d.status||"draft")).length;
  let rows=S.docs.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(S.tab!=="all")rows=rows.filter(d=>d.type===S.tab);
  const q=norm(S.q);
  if(q)rows=rows.filter(d=>norm(d.number+" "+d.client.name+" "+d.client.phone+" "+recService(d)).includes(q));
  const tabs=[["all","All"],["quote","Quotes"],["invoice","Invoices"],["receipt","Receipts"]].map(([k,l])=>`<button data-a="tab" data-t="${k}" aria-pressed="${S.tab===k}">${l}</button>`).join("");
  const body=rows.length?rows.map(d=>{const [st,cl]=statusOf(d);const amt=d.type==="receipt"?recPaid(d):calc(d).total;
    return `<button class="item" data-a="open" data-id="${d.id}">
    <span class="num">${esc(d.number)}<br>${esc(TYPES[d.type].label)}</span>
    <span class="cl"><b>${esc(d.client.name||"No client name")}</b><span>${d.type==="receipt"&&recService(d)?esc(recService(d))+" · ":""}${esc(d.date)}${d.type==="invoice"&&d.due?" · due "+esc(d.due):""}</span></span>
    <span class="amt">${money(amt)}</span><span class="pill ${cl}">${esc(st)}</span></button>`}).join("")

/* ---------- output: text and PDF ---------- */
function textOf(d){
  const s=S.settings,L=[];
  L.push(`*${TYPES[d.type].title.toUpperCase()} ${d.number}*`,s.name,"");
  if(d.client.name)L.push(`${d.type==="receipt"?"Received from":"For"}: ${d.client.name}`);
  L.push(`Date: ${d.date}`);
  if(d.type==="receipt"){
    const i=recInfo(d);
    L.push(`For: ${recService(d)}`,"");
    if(i.price>0)L.push(`Full price: ${money(i.price)}`);
    if(i.prev>0)L.push(`Already paid: ${money(i.prev)}`);
    L.push(`*Paid today: ${money(i.paid)}*`,`Total paid: ${money(i.total)}`);
    if(i.bal!==null)L.push(i.bal>0?`*Balance: ${money(i.bal)}*`:"*Paid in full*");
    L.push(`Paid by: ${methodText(d)}${d.ref?" (Ref "+d.ref+")":""}`);
  }else{
    const c=calc(d);
    if(d.due)L.push(`${d.type==="quote"?"Valid until":"Due"}: ${d.due}`);L.push("");
    d.items.filter(l=>l.d||num(l.p)).forEach(l=>L.push(`${l.d} - ${num(l.q)} x ${money(l.p)} = ${money(num(l.q)*num(l.p))}`));
    L.push("");if(num(d.taxRate))L.push(`Tax ${num(d.taxRate)}%: ${money(c.tax)}`);
    L.push(`*Total: ${money(c.total)}*`);
    if(d.type==="invoice"){const p=paidOf(d);L.push(`Paid: ${money(p)}`,`*Balance due: ${money(c.total-p)}*`)}
    if(s.payInfo)L.push("","How to pay:",s.payInfo);
  }
  if(d.notes)L.push("",d.notes);
  return L.join("\n");
}

    doc.setFont("helvetica","normal").setFontSize(size);lines.forEach(l=>{if(ly>285){doc.addPage();ly=M}doc.text(l,M,ly);ly+=size>10?6:4.6});ly+=7};

    const sy=Math.max(startY+10,ly-h-14);img(s.sig,R-62+(55-w)/2,sy,w,h);txt(10,10,10);doc.setFont("helvetica","bold").setFontSize(10.5).text("Authorized Sign",R-34.5,sy+h+7,{align:"center"})}

async function downloadPDF(d){
  if(!window.jspdf){toast("PDF tool did not load. Check your connection.");return}
  const name=`${d.number} ${d.client.name||""}`.trim().replace(/[^\w\- ]+/g,"")+".pdf";
  try{
    const dl=(typeof claude!=="undefined")?await claude.use("downloads"):null;
    const bytes=makePDF(d).output("arraybuffer");
    if(dl){await dl.save({filename:name,data:bytes})}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
    toast("PDF ready");
  }catch(e){if(e&&e.code==="declined")return;toast("Could not save the PDF.")}
}
async function copyText(d){

  catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copied. Paste it into WhatsApp.")}catch(_){toast("Could not copy.")}ta.remove()}
}

/* ---------- logo / signature image ---------- */
function loadLogo(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error("read"));
    fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error("img"));
      im.onload=()=>{
        const mw=520,sc=Math.min(1,mw/im.naturalWidth),w=Math.max(1,Math.round(im.naturalWidth*sc)),h=Math.max(1,Math.round(im.naturalHeight*sc));
        const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");
        x.drawImage(im,0,0,w,h);let url=c.toDataURL("image/png");
        if(url.length>180000){x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);url=c.toDataURL("image/jpeg",.85)}
        res({logo:url,logoW:w,logoH:h});
      };im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

  }else if(e.target.id==="vf"){
    const o={id:S.se?S.se.id:uid(),name:v("v_name").trim(),price:num(v("v_price")),desc:v("v_desc").trim()};
    if(!o.name){toast("Add the service name.");return}
    await put("services",o);S.se=null;toast("Service saved");render();
  }
});

/* ---------- optional cloud login (Supabase) ---------- */
function adapter(){return{doc(path){let [col,id]=path.split("/");if(path==="app/settings"){col="settings";id="app"}return{
  async set(o){const {error}=await SB.from("records").upsert({user_id:UID,col,id,data:o,updated_at:new Date().toISOString()},{onConflict:"user_id,col,id"});if(error)throw error},
  async delete(){const {error}=await SB.from("records").delete().eq("user_id",UID).eq("col",col).eq("id",id);if(error)throw error}}}}}
const CK=LS+"-cloud";
function applyRows(rows){
  const d={docs:[],clients:[],services:[]};let st=null;
  rows.forEach(r=>{if(r.col==="settings")st=r.data;else if(d[r.col])d[r.col].push(r.data)});
  S.docs=d.docs;S.clients=d.clients;S.services=d.services;if(st)S.settings=Object.assign(S.settings,st);
}
async function pull(){
  const {data,error}=await SB.from("records").select("col,id,data");
  if(error){
    try{const c=JSON.parse(localStorage.getItem(CK+"-"+UID)||"null");if(c){applyRows(c);toast("Offline. Showing your last saved data.")}else toast("Could not load your data.")}catch(e){toast("Could not load your data.")}
    return null;
  }
  try{localStorage.setItem(CK+"-"+UID,JSON.stringify(data))}catch(e){}
  applyRows(data);return data;
}
async function startCloud(session){
  UID=session.user.id;S.user=session.user.email||"";DB=adapter();
  const rows=await pull();
  if(rows&&rows.length===0){ // first sign-in: bring over anything made on this device before
    const l=lsGet();
    if(l&&((l.docs||[]).length||(l.clients||[]).length||(l.services||[]).length)){
      const up=[];
      (l.docs||[]).forEach(o=>up.push({col:"docs",id:o.id,data:o}));
      (l.clients||[]).forEach(o=>up.push({col:"clients",id:o.id,data:o}));
      (l.services||[]).forEach(o=>up.push({col:"services",id:o.id,data:o}));
      if(l.settings)up.push({col:"settings",id:"app",data:l.settings});
      const {error}=await SB.from("records").upsert(up.map(r=>Object.assign({user_id:UID,updated_at:new Date().toISOString()},r)),{onConflict:"user_id,col,id"});
      if(!error){await pull();toast("Your data from this device was added to your account.")}
    }
  }
  S.view="list";S.msg="";render();
  if(CH)SB.removeChannel(CH);
  CH=SB.channel("records-"+UID).on("postgres_changes",{event:"*",schema:"public",table:"records",filter:"user_id=eq."+UID},()=>refresh()).subscribe();
}
function refresh(){
  clearTimeout(pullT);
  pullT=setTimeout(async()=>{
    if(!UID||!["list","view","clients","services"].includes(S.view))return;
    if(await pull())render();
  },350);
}
function stopCloud(){
  if(CH){SB.removeChannel(CH);CH=null}
  UID=null;DB=null;S.user="";S.docs=[];S.clients=[];S.services=[];
}

/* ---------- boot ---------- */
(async function boot(){
  if(CLOUD){
    SB=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
    let sess=null;try{sess=(await SB.auth.getSession()).data.session}catch(e){}
    if(sess)await startCloud(sess);else{S.view="login";render()}
    return;
  }
  const l=lsGet();if(l){S.docs=l.docs||[];S.clients=l.clients||[];S.services=l.services||[];S.settings=Object.assign(S.settings,l.settings||{})}
  render();
  try{
    DB=(typeof claude!=="undefined")?await claude.use("db"):null;
    if(DB){
      const live=()=>["list","view","clients","services"].includes(S.view);
      DB.doc("app/settings").onSnapshot(s=>{if(s.exists){S.settings=Object.assign(S.settings,s.data());if(S.view==="list")render()}},()=>{});
      DB.collection("docs").onSnapshot(q=>{S.docs=q.docs.map(x=>x.data());if(live())render()},()=>{DB=null});
      DB.collection("clients").onSnapshot(q=>{S.clients=q.docs.map(x=>x.data());if(S.view==="clients")render()},()=>{});
      DB.collection("services").onSnapshot(q=>{S.services=q.docs.map(x=>x.data());if(S.view==="services")render()},()=>{});
    }
  }catch(e){DB=null}
})();

</script>
